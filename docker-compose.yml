services:
  db:
    image: cockroachdb/cockroach:${COCKROACH_IMAGE_VERSION:-v25.2.0}
    container_name: incidentmind-db
    command: start-single-node --insecure --http-addr=0.0.0.0:8081
    ports:
      - "26257:26257"
      - "8081:8081"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "node", "status", "--insecure"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cockroach-data:
